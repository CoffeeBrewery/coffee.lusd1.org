url: "https://coffee.lusd1.org"
title: "CoffeeBrewery"
description: "The Package Manager for Everywhere"

exclude:
  - .playwright-cli/
  - AGENTS.md
  - CLAUDE.md
  - bin/
  - brew/
  - CNAME
  - coffee-formulae.lusd1.org/
  - Gemfile*
  - Rakefile
  - README.md
  - vendor/

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: atom.xml
  posts_limit: 100

permalink: :title

defaults:
  - scope:
      type: posts
    values:
      layout: post
      permalink: :year/:month/:day/:title/
  - scope:
      path: ""
    values:
      image: /assets/img/homebrew-social-card.png

logo: /assets/img/coffeebrewery.png

github:
  repository_nwo: CoffeeBrewery/coffee.lusd1.org

forkme_nwo: CoffeeBrewery/coffee

twitter:
  username: MacHomebrew

facebook:
  publisher: https://www.facebook.com/machomebrew/

link_rel_me_urls:
  - https://fosstodon.org/@homebrew
